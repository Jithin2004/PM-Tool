version: '3.9'

# ═══════════════════════════════════════════════════════════════
#  RESOLVE PM v1.3.0-internal-stable — Production Docker Stack
#  ─────────────────────────────────────────────────────────────
#  Services:
#    resolvepm-app   → Vite production build served via Nginx
#    postgres        → PostgreSQL 15 with production schema init
#    pgbackup        → Automated daily pg_dump backup sidecar
#  ─────────────────────────────────────────────────────────────
#  Usage:
#    docker compose up -d --build
#    docker compose logs -f
#    docker compose down -v   ← WARNING: destroys database volume
# ═══════════════════════════════════════════════════════════════

networks:
  resolvepm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
    driver: local
  backup-data:
    driver: local

services:

  # ─────────────────────────────────────────────────────────────
  #  1. PostgreSQL 15 — Primary Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: resolvepm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolvepm}
      POSTGRES_USER: ${POSTGRES_USER:-resolvepm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount the consolidated production schema as init script
      - ./database/production/RESOLVE_PM_V1_3_INSTALL.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Expose on localhost only — never expose to 0.0.0.0 in production
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      resolvepm-net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolvepm_admin} -d ${POSTGRES_DB:-resolvepm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_statement=ddl

  # ─────────────────────────────────────────────────────────────
  #  2. Resolve PM App — Vite Production Build (Nginx)
  # ─────────────────────────────────────────────────────────────
  resolvepm-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_PRODUCT_KEY_API_URL: ${VITE_PRODUCT_KEY_API_URL:-http://localhost:5000}
        VITE_APP_VERSION: "1.3.0-internal-stable"
        VITE_BUILD_ENV: "production"
    container_name: resolvepm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      resolvepm-net:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.resolvepm.service: "frontend"
      com.resolvepm.version: "1.3.0-internal-stable"

  # ─────────────────────────────────────────────────────────────
  #  3. License Key Backend — Node.js activation server
  # ─────────────────────────────────────────────────────────────
  license-server:
    build:
      context: ./backend/product-key
      dockerfile: Dockerfile
    container_name: resolvepm-license
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      LICENSE_PRIVATE_KEY_PATH: /run/secrets/license_private_key
      DATABASE_URL: postgres://${POSTGRES_USER:-resolvepm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resolvepm}
    ports:
      - "127.0.0.1:${LICENSE_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      resolvepm-net:
        ipv4_address: 172.30.0.30
    secrets:
      - license_private_key
    labels:
      com.resolvepm.service: "license-server"
      com.resolvepm.version: "1.3.0-internal-stable"

  # ─────────────────────────────────────────────────────────────
  #  4. Automated DB Backup Sidecar
  # ─────────────────────────────────────────────────────────────
  pgbackup:
    image: postgres:15-alpine
    container_name: resolvepm-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-resolvepm}
      POSTGRES_USER: ${POSTGRES_USER:-resolvepm_admin}
      POSTGRES_HOST: postgres
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      resolvepm-net:
        ipv4_address: 172.30.0.40
    # Runs pg_dump every 24 hours; keeps last 7 days
    entrypoint: >
      sh -c "
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB -F c -f /backups/resolvepm_$${TIMESTAMP}.pgdump;
          echo \"Backup completed: resolvepm_$${TIMESTAMP}.pgdump\";
          find /backups -name '*.pgdump' -mtime +7 -delete;
          echo \"Old backups pruned.\";
          sleep 86400;
        done
      "
    labels:
      com.resolvepm.service: "db-backup"

# ─────────────────────────────────────────────────────────────
#  Docker Secrets — Private Key for License Signing
#  Create with: docker secret create license_private_key ./private_key.pem
# ─────────────────────────────────────────────────────────────
secrets:
  license_private_key:
    external: true
