[tool.poetry]
name = "resolve-intelligence-platform"
version = "1.5.0"
description = "Resolve Intelligence Python Platform (BCP Milestone 1)"
authors = ["Resolve Intelligence Team <team@resolve.pm>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
pandas = "^2.2.1"
numpy = "^1.26.4"
scikit-learn = "^1.4.1.post1"
xgboost = "^2.0.3"
lightgbm = "^4.3.0"
mlflow = "^2.11.3"
optuna = "^3.6.1"
joblib = "^1.3.2"
pyarrow = "^15.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
ruff = "^0.3.5"
mypy = "^1.9.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
